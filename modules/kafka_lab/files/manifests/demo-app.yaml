apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: demo
  labels: { app: consumer }
spec:
  replicas: 0            # KEDA scales this 0 <-> 6
  selector:
    matchLabels: { app: consumer }
  template:
    metadata:
      labels: { app: consumer }
    spec:
      imagePullSecrets:
        - name: ar-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: @@APP_IMAGE@@
          env:
            - { name: MODE, value: consumer }
            - { name: KAFKA_BOOTSTRAP, value: "demo-kafka-bootstrap.kafka.svc:9092" }
            - { name: TOPIC, value: orders }
            - { name: GROUP, value: orders-consumer }
            - { name: PROCESS_DELAY_MS, value: "200" }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: demo
  labels: { app: producer }
spec:
  replicas: 0            # scale to 1 for a steady stream: kubectl -n demo scale deploy/producer --replicas=1
  selector:
    matchLabels: { app: producer }
  template:
    metadata:
      labels: { app: producer }
    spec:
      imagePullSecrets:
        - name: ar-pull
      containers:
        - name: app
          image: @@APP_IMAGE@@
          env:
            - { name: MODE, value: producer }
            - { name: KAFKA_BOOTSTRAP, value: "demo-kafka-bootstrap.kafka.svc:9092" }
            - { name: TOPIC, value: orders }
            - { name: RATE, value: "5" }
            - { name: BURST, value: "0" }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits:   { cpu: 200m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
