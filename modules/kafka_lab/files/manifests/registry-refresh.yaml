# Keeps an imagePullSecret (ar-pull) fresh with a short-lived token from the GCE
# metadata server (node service account). No long-lived keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-refresher
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-refresher
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-refresher
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-refresher
subjects:
  - kind: ServiceAccount
    name: registry-refresher
    namespace: demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-refresh
  namespace: demo
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: registry-refresher
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: curlimages/curl:8.11.1
              resources:
                requests: { cpu: 5m, memory: 16Mi }
                limits:   { cpu: 100m, memory: 64Mi }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  TOKEN=$(curl -sf -H 'Metadata-Flavor: Google' \
                    http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token \
                    | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  [ -n "$TOKEN" ] || { echo "no token from metadata server"; exit 1; }
                  AUTH=$(printf 'oauth2accesstoken:%s' "$TOKEN" | base64 | tr -d '\n')
                  CFG=$(printf '{"auths":{"@@REGISTRY_HOST@@":{"username":"oauth2accesstoken","password":"%s","auth":"%s"}}}' "$TOKEN" "$AUTH" | base64 | tr -d '\n')
                  BODY=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"ar-pull","namespace":"demo"},"type":"kubernetes.io/dockerconfigjson","data":{".dockerconfigjson":"%s"}}' "$CFG")
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  URL=https://kubernetes.default.svc/api/v1/namespaces/demo/secrets
                  call() { curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt \
                    -H "Authorization: Bearer $(cat $SA/token)" -H 'Content-Type: application/json' \
                    -X "$1" --data "$BODY" "$2"; }
                  CODE=$(call PUT "$URL/ar-pull")
                  [ "$CODE" = 404 ] && CODE=$(call POST "$URL")
                  echo "secret ar-pull refreshed, http $CODE"
                  case "$CODE" in 200|201) ;; *) exit 1;; esac
