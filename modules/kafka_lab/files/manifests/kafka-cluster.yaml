apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
      - pattern: kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec), topic=(.+)><>Count
        name: kafka_server_brokertopicmetrics_$1_total
        labels: { topic: "$2" }
        type: COUNTER
      - pattern: kafka.server<type=ReplicaManager, name=(.+)><>Value
        name: kafka_server_replicamanager_$1
        type: GAUGE
      - pattern: kafka.controller<type=KafkaController, name=(.+)><>Value
        name: kafka_controller_kafkacontroller_$1
        type: GAUGE
      - pattern: kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value
        name: kafka_log_log_size
        labels: { topic: "$1", partition: "$2" }
        type: GAUGE
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels:
    strimzi.io/cluster: demo
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: @@KAFKA_VOLUME_SIZE@@
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "1", memory: 1536Mi }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: demo
  namespace: kafka
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      log.retention.hours: 24
      log.retention.bytes: 268435456
      log.segment.bytes: 67108864
      group.initial.rebalance.delay.ms: 0
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 300m, memory: 384Mi }
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 128Mi }
