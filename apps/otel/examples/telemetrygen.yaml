# One-off job that sends 20 test spans to the agent's OTLP endpoint.
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen
  namespace: observability
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
          args:
            - traces
            - --otlp-endpoint=otel-agent.observability.svc.cluster.local:4317
            - --otlp-insecure
            - --traces=20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
